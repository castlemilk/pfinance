name: Deploy Production

# All production deploys (frontend + backend) now run on Cuttlefish:
#   - pfinance-deploy         → Vercel prod (auto on push to main)
#   - pfinance-backend-deploy → Cloud Run prod (auto on push to main)
# Both run on the local Cuttlefish agent — zero GitHub Actions minutes,
# zero Vercel build minutes (prebuilt deploys).
#
# Manual one-offs that stayed out of CI:
#   - Firestore index deploys: `make deploy-indexes` (rare, schema-bound)
#
# This workflow is kept as a manual-dispatch escape hatch in case Cuttlefish
# is down. To use it, add the deploy jobs back from git history
# (commit 722e719 has the last full version).

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Production deploys live in Cuttlefish."
          echo "  pfinance-deploy:         https://api.cuttlefish.sh (Vercel)"
          echo "  pfinance-backend-deploy: https://api.cuttlefish.sh (Cloud Run)"
          echo "Manual indexes: make deploy-indexes"
