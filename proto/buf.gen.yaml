# Keep generated APIs aligned with the repository's existing runtimes.
# Update plugin versions and generated output together; never resolve latest implicitly.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/castlemilk/pfinance/backend/gen
plugins:
  # Go - Protocol Buffers message types
  # Local plugins, not BSR remote: remote generation gets rate-limited and CI
  # already installs these binaries on PATH before running buf generate.
  - local: protoc-gen-go
    out: ../backend/gen
    opt:
      - paths=source_relative
  # Go - Connect-RPC service stubs (replaces grpc/go for Connect protocol)
  - local: protoc-gen-connect-go
    out: ../backend/gen
    opt:
      - paths=source_relative
  # TypeScript/JavaScript - Protobuf-ES v2 (generates messages AND service definitions)
  # Binary comes from web/node_modules/.bin (@bufbuild/protoc-gen-es devDependency).
  - local: protoc-gen-es
    out: ../web/src/gen
    opt:
      - target=ts