version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/castlemilk/pfinance/backend/gen
plugins:
  # Go - Protocol Buffers message types
  # Local plugins, not BSR remote: remote generation gets rate-limited and CI
  # already installs these binaries on PATH before running buf generate.
  - local: protoc-gen-go
    out: ../backend/gen
    opt:
      - paths=source_relative
  # Go - Connect-RPC service stubs
  - local: protoc-gen-connect-go
    out: ../backend/gen
    opt:
      - paths=source_relative
